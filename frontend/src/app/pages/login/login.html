<app-default-login-layout
    primaryBtnText="Login Now →"
    secondaryBtnText="Sign Up For Free"
    (submit)="submit()"
    (navigate)="navigate()"
    [disablePrimaryBtn]="!loginForm.valid"
>
    <form [formGroup]="loginForm">
        <app-default-form-input
            formControlName="email"
            inputName="email"
            type="email"
            label="EMAIL ADRESS"
            placeholder="guest@auragrand.com.br"
        >
            <img src="/assets/svg/email-icon.svg">
        </app-default-form-input>
        <app-default-form-input
            formControlName="password"
            inputName="password"
            type="password"
            label="PASSWORD"
            placeholder="••••••••••••"
        >
            <img src="/assets/svg/password-icon.svg">
        </app-default-form-input>
        <span>Forgot Password?</span>
        <div class="checkbox-container">
            <input type="checkbox" id="inscricao" name="newslettet" value="sim">
            <label for="inscricao">Remember this workstation for private access</label>
        </div>
    </form>
</app-default-login-layout>
